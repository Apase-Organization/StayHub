services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stayhub_db}
      POSTGRES_USER: ${DB_USERNAME:-stayhub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,demo}
      SEED_DATA_ENABLED: ${SEED_DATA_ENABLED:-true}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-stayhub_db}
      DB_USERNAME: ${DB_USERNAME:-stayhub_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SERVER_PORT: 8080
      APP_LOCAL_URL: ${APP_LOCAL_URL:-http://localhost:8080}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-StayHub Administrator}
      UPLOAD_USE_CLOUDINARY: ${UPLOAD_USE_CLOUDINARY:-false}
      UPLOAD_LOCAL_DIRECTORY: /app/uploads
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-10MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-50MB}
      UPLOAD_MAX_IMAGES_PER_PROPERTY: ${UPLOAD_MAX_IMAGES_PER_PROPERTY:-10}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SYSTEM_NAME: ${MAIL_SYSTEM_NAME:-StayHub System}
      MAIL_FROM: ${MAIL_FROM:-no-reply@stayhub.local}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-stayhub-google-client-id-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-stayhub-google-client-secret-placeholder}
      QUOTE_VALIDITY_SECONDS: ${QUOTE_VALIDITY_SECONDS:-300}
      APP_PAYMENT_DEMO_RETURN_VERIFICATION_ENABLED: ${APP_PAYMENT_DEMO_RETURN_VERIFICATION_ENABLED:-true}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_CONFIG_VERSION: ${VNPAY_CONFIG_VERSION:-sandbox-local-v1}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/payments/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/v1/payments/vnpay/ipn}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - property_uploads:/app/uploads

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8080"]
    depends_on:
      - app

volumes:
  pgdata_v16:
  property_uploads:
