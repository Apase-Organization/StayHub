spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/stayhub_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  thymeleaf:
    cache: false

# Demo profile only; production/base remains disabled.
app:
  payment:
    demo-return-verification-enabled: ${APP_PAYMENT_DEMO_RETURN_VERIFICATION_ENABLED:true}
