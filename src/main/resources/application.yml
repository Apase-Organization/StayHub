spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: stayhub

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:stayhub-google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:stayhub-google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}

server:
  port: ${SERVER_PORT:8080}

app:
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:StayHub Administrator}
  upload:
    use-cloudinary: ${UPLOAD_USE_CLOUDINARY:false}
    local-directory: ${UPLOAD_LOCAL_DIRECTORY:uploads}
    local-base-url: ${UPLOAD_LOCAL_BASE_URL:/uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
    max-images-per-property: ${UPLOAD_MAX_IMAGES_PER_PROPERTY:10}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    system-name: ${MAIL_SYSTEM_NAME:StayHub System}
    from: ${MAIL_FROM:no-reply@stayhub.local}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  payment:
    quote-validity-seconds: ${QUOTE_VALIDITY_SECONDS:0}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      config-version: ${VNPAY_CONFIG_VERSION:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
