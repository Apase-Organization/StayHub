<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh email - StayHub</title>
    <link th:href="@{/css/tailwind.css}" rel="stylesheet">
</head>
<body class="bg-bg-light text-text-900 font-sans flex flex-col min-h-screen">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow flex items-center justify-center p-6">
    <div class="bg-bg-white border border-border rounded-xl shadow-sm w-full max-w-md p-8">
        <h1 class="text-2xl font-bold text-center mb-3">Xác minh email của bạn</h1>
        <p class="mb-6 text-center text-sm text-text-gray">Chúng tôi đã gửi mã gồm 6 chữ số đến email của bạn. Nhập mã để tạo tài khoản.</p>

        <form th:action="@{/register/verify}" th:object="${verifyRegistrationRequest}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{email}">
            <div>
                <label for="otp" class="block text-sm font-semibold mb-1">Mã xác minh</label>
                <input type="text" id="otp" th:field="*{otp}" inputmode="numeric" maxlength="6" required
                       class="w-full px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary-500 focus:outline-none transition"
                       th:classappend="${#fields.hasErrors('otp')} ? 'border-primary-500' : ''">
                <p th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}" class="text-primary-600 text-xs mt-1"></p>
            </div>
            <button class="w-full bg-primary-500 hover:bg-primary-600 text-bg-white font-bold py-3 rounded-lg transition mt-2">
                Xác minh và tạo tài khoản
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-text-gray">
            Email chưa đúng? <a th:href="@{/register}" class="text-primary-500 hover:underline font-semibold">Bắt đầu lại</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
