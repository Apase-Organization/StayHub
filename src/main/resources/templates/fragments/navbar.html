<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Navbar Fragment -->
    <header th:fragment="navbar" class="bg-bg-white border-b border-border h-[72px] flex items-center justify-between px-6 lg:px-10 sticky top-0 z-50">
        
        <!-- Logo Left -->
        <a th:href="@{/}" class="flex items-center gap-2 text-primary-500 hover:text-primary-600 transition">
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
            <span class="text-xl font-bold font-sans hidden md:block">StayHub</span>
        </a>

        <!-- Search Bar (Center) -->
        <div class="hidden md:flex items-center border border-border rounded-full shadow-sm hover:shadow-md transition cursor-pointer px-4 py-2 text-sm font-semibold text-text-900">
            <span class="px-4 border-r border-border">Mọi điểm đến</span>
            <span class="px-4 border-r border-border">Mọi thời điểm</span>
            <span class="px-4 text-text-gray font-normal">Thêm khách</span>
            <div class="bg-primary-500 text-bg-white p-2 rounded-full ml-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Right Menu -->
        <div class="flex items-center gap-4 text-sm font-semibold text-text-900 relative">
            <a sec:authorize="hasAnyRole('HOST','ADMIN')" th:href="@{/host/dashboard}" class="hidden md:block hover:bg-bg-light px-4 py-2 rounded-full transition">Khu vực chủ chỗ nghỉ</a>
            
            <!-- Account menu; behavior is initialized within this rendered fragment. -->
            <div data-account-menu-root class="relative">
                
                <!-- Dropdown Trigger Button -->
                <button type="button" data-account-menu-trigger aria-expanded="false" aria-controls="account-menu"
                        aria-label="Mở menu tài khoản"
                        class="flex items-center gap-2 border border-border rounded-full p-2 hover:shadow-md transition cursor-pointer bg-bg-white focus:outline-none">
                    <!-- Hamburger Icon -->
                    <svg class="w-5 h-5 text-text-gray ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <!-- Avatar Icon -->
                    <div class="bg-text-gray text-bg-white rounded-full p-1">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                </button>

                <!-- Dropdown Menu -->
                <div id="account-menu" data-account-menu-panel hidden
                     class="absolute right-0 mt-2 w-64 bg-bg-white rounded-xl shadow-lg border border-border py-2 z-50">
                    
                    <!-- 1. UNAUTHENTICATED MENU (Guest is not logged in) -->
                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="block px-4 py-3 hover:bg-bg-light font-bold text-text-900">Sign in</a>
                        <a th:href="@{/register}" class="block px-4 py-3 hover:bg-bg-light text-text-900">Sign Up</a>
                        <hr class="my-1 border-border">
                        <a href="#" class="block px-4 py-3 hover:bg-bg-light text-text-900">Trợ giúp</a>
                    </div>

                    <!-- 2. AUTHENTICATED MENU (User is logged in) -->
                    <div sec:authorize="isAuthenticated()">
                        
                        <!-- User Info Header -->
                        <div class="px-4 py-3 border-b border-border mb-1">
                            <p class="font-bold text-text-900 truncate" sec:authentication="principal.fullName">Full Name</p>
                            <p class="text-xs text-text-gray truncate" sec:authentication="principal.email">email@domain.com</p>
                        </div>
                        
                        <!-- Core Navigation -->
                        <a th:href="@{/bookings(tab='upcoming')}" class="block px-4 py-3 hover:bg-bg-light font-bold text-text-900">Chuyến đi</a>
                        <a href="#" class="block px-4 py-3 hover:bg-bg-light font-bold text-text-900">Danh sách yêu thích</a>
                        <hr class="my-1 border-border">
                        
                        <!-- Host Features (Visible to everyone for MVP context, or restrict to HOST role) -->
                        <a sec:authorize="hasAnyRole('HOST','ADMIN')" th:href="@{/host/dashboard}" class="block px-4 py-3 hover:bg-bg-light text-text-900">Quản lý chỗ nghỉ</a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="block px-4 py-3 hover:bg-bg-light font-bold text-primary-500">Bảng quản trị</a>
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/financial-operations}" class="block px-4 py-3 hover:bg-bg-light text-text-900">Vận hành tài chính</a>
                        <a th:href="@{/profile}" class="block px-4 py-3 hover:bg-bg-light text-text-900">Hồ sơ</a>
                        <hr class="my-1 border-border">
                        
                        <!-- Logout Action (Requires POST request for Spring Security) -->
                        <form th:action="@{/logout}" method="post" class="w-full m-0 p-0">
                            <button type="submit" class="w-full text-left block px-4 py-3 hover:bg-bg-light text-primary-500 font-semibold">
                                Đăng xuất
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
        <script>
            (() => {
                const root = document.querySelector('[data-account-menu-root]');
                if (!root || root.dataset.menuInitialized === 'true') return;

                root.dataset.menuInitialized = 'true';
                const trigger = root.querySelector('[data-account-menu-trigger]');
                const panel = root.querySelector('[data-account-menu-panel]');
                const closeMenu = () => {
                    panel.hidden = true;
                    trigger.setAttribute('aria-expanded', 'false');
                };

                trigger.addEventListener('click', () => {
                    const willOpen = panel.hidden;
                    panel.hidden = !willOpen;
                    trigger.setAttribute('aria-expanded', String(willOpen));
                });

                document.addEventListener('click', event => {
                    if (!root.contains(event.target)) {
                        closeMenu();
                    } else if (panel.contains(event.target) && event.target.closest('a, button, form')) {
                        closeMenu();
                    }
                });

                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && !panel.hidden) {
                        closeMenu();
                        trigger.focus();
                    }
                });

                window.addEventListener('pageshow', closeMenu);
                window.addEventListener('pagehide', closeMenu);
            })();
        </script>
    </header>
</body>
</html>
